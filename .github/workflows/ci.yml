name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gui_tests:
        description: "Explicitly run the full native GUI suites"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build (Release)
        run: cargo build --locked --release -p desktopplus

      - name: Native UI smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gui_tests }}
        shell: pwsh
        run: ./scripts/test-native-ui.ps1

      - name: Native display and input test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gui_tests }}
        shell: pwsh
        run: ./scripts/test-native-display.ps1 -Executable target/release/DesktopPlus.exe
