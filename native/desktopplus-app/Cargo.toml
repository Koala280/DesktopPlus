[package]
name = "desktopplus"
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
default-run = "DesktopPlus"

[[bin]]
name = "DesktopPlus"
path = "src/main.rs"

[dependencies]
desktopplus-core = { path = "../desktopplus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
notify = "8"
windows-core = "0.62"
zip = { version = "4", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_System_Ole", "Win32_System_SystemServices"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_Security",
    "Win32_System_Com", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time",
    "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_Networking_WinHttp",
] }

[build-dependencies]
embed-resource = "3"
